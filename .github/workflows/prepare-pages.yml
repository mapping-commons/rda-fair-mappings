name: Prepare FAIR Mappings Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/docs/**
      - mkdocs.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build:
    name: Deploy docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Create venv
        run: uv venv

      - name: Install Python deps with uv
        run: uv pip install -r requirements.txt

      - name: Build & deploy docs
        run: |
          source .venv/bin/activate
          make deploy-docs
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@4e1beaa7521e8b457b572c090b25bd3db56bf1c5 # v5.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch-suffix: short-commit-hash
          labels: automated
          body: "Automated update of the documentation pages."
          title: "Update documentation pages."
          base: main
          branch: update_docs_gha
          reviewers: matentzn
          commit-message: "[create-pull-request] automated change"
          delete-branch: false
          draft: false

